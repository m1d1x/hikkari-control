<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>NEKKO Admin</title>
		<!-- Runtime config, rendered by the container at start. Classic script
		     and placed before the app so window.__NEKKO_ADMIN_CONFIG__ exists
		     by the time any module reads it. -->
		<script src="%sveltekit.assets%/config.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# SvelteKit's adapter-static is configured with fallback: '200.html'
	# (svelte.config.js), so every client-routed path is served that shell.
	# The build emits no index.html, so the shell is also the directory index:
	# without this `/` resolves through `$uri/` to nginx's stock welcome page.
	index 200.html;
	error_page 404 /200.html;

	# Runtime config is rewritten on every container start and is the one file
	# that MUST NOT be cached: a stale copy would point a freshly-moved panel
	# at the API it used to talk to.
	location = /config.js {
		add_header Cache-Control "no-store" always;
	}

	# Hashed build assets are immutable by construction.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	location / {
		try_files $uri $uri/ /200.html;
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;
}
